services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: casso
      POSTGRES_PASSWORD: casso
      POSTGRES_DB: casso_ledger
    ports:
      - "5432:5432"
    volumes:
      - casso_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  casso_pg_data:
