name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            filter: '@casso-ar/backend'
          # Everything else, so a newly added package is covered without
          # editing this file.
          - name: frontend
            filter: '!@casso-ar/backend'

    env:
      # main always re-runs everything; PRs reuse cached results for packages
      # whose inputs did not change.
      TURBO_FORCE: ${{ github.event_name == 'push' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.name }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.name }}-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same task set as `pnpm verify` followed by `pnpm build`, split by package
      # so the two halves run on separate runners.
      - name: Verify and build
        run: pnpm turbo run lint type-check test arch-check build --filter='${{ matrix.filter }}'
