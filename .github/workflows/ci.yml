name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  viewport:
    name: viewport
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @casso-ar/frontend exec playwright install --with-deps chromium

      - name: Run viewport tests
        run: pnpm --filter @casso-ar/frontend test:viewport

  verify:
    name: verify (${{ matrix.name }})
    runs-on: ubuntu-latest

    # Together these legs run every task of `pnpm verify` + `pnpm build`
    # (lint, type-check, test, arch-check, build) exactly once:
    #   backend         - all of @casso-ar/backend
    #   other           - every package except backend, minus the frontend tests
    #   frontend-test-N - the frontend vitest suite, split into 3 shards
    # `other` excludes backend/frontend by name only, so a newly added package
    # is covered without editing this file.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            command: pnpm turbo run lint type-check test arch-check build --filter='@casso-ar/backend'
          - name: other
            command: >-
              pnpm turbo run lint type-check arch-check build --filter='!@casso-ar/backend' &&
              pnpm turbo run test --filter='!@casso-ar/backend' --filter='!@casso-ar/frontend'
          - name: frontend-test-1
            command: pnpm turbo run test --filter='@casso-ar/frontend' -- --shard=1/3
          - name: frontend-test-2
            command: pnpm turbo run test --filter='@casso-ar/frontend' -- --shard=2/3
          - name: frontend-test-3
            command: pnpm turbo run test --filter='@casso-ar/frontend' -- --shard=3/3

    env:
      # main always re-runs everything; PRs reuse cached results for packages
      # whose inputs did not change.
      TURBO_FORCE: ${{ github.event_name == 'push' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.name }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.name }}-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
